
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b16">
<title>JARVIS SECURITY</title>

<style>
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle,#102c48,#030711 75%);
  color:#00d9ff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:25px 16px;
}
h1 {
  margin-top:35px;
  letter-spacing:8px;
  text-shadow:0 0 20px #00d9ff;
}
.sub { letter-spacing:4px;color:#91b9ca;font-size:12px; }
.orb {
  width:155px;height:155px;border:2px solid #00d9ff;
  border-radius:50%;margin:35px auto;
  display:grid;place-items:center;
  box-shadow:0 0 35px #008bc0,inset 0 0 30px #008bc0;
  font-size:55px;
}
.panel {
  max-width:420px;margin:20px auto;padding:22px;
  border:1px solid #087da0;border-radius:16px;
  background:#071524e8;
}
input {
  width:100%;padding:14px;margin:8px 0;
  border:1px solid #087da0;border-radius:8px;
  background:#030b16;color:white;font-size:15px;
}
button {
  width:100%;padding:14px;margin:8px 0;
  border:1px solid #00d9ff;border-radius:25px;
  background:#06233a;color:#00d9ff;
  font-weight:bold;letter-spacing:1px;
}
button:disabled {opacity:.5}
#message {color:#b4eaff;font-size:13px;line-height:1.5}
.hidden {display:none}
</style>
</head>

<body>
<h1>JARVIS</h1>
<div class="sub">SECURITY SYSTEM</div>
<div class="orb">◉</div>

<div class="panel" id="login">
  <h3>ACESSO AO SISTEMA</h3>
  <input id="email" type="email" placeholder="Seu e-mail">
  <input id="password" type="password" placeholder="Sua senha">

  <button onclick="cadastrar()">CRIAR CONTA</button>
  <button onclick="entrar()">ENTRAR COM SENHA</button>
  <button onclick="entrarPasskey()">ENTRAR COM PASSKEY</button>
</div>

<div class="panel hidden" id="dashboard">
  <h3>JARVIS ONLINE</h3>
  <p>Identidade autenticada.</p>
  <button onclick="cadastrarPasskey()">CADASTRAR PASSKEY / FACE ID</button>
  <button onclick="sair()">ENCERRAR SESSÃO</button>
</div>

<div id="message">AGUARDANDO AUTENTICAÇÃO...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL =
  "https://thcszojpxzxpbmiyzder.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_tgsdXiO514XfTMmGXbI6rQ_w9THA5zX";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      experimental: { passkey: true }
    }
  }
);

const msg = document.getElementById("message");

function mensagem(texto) {
  msg.innerText = texto;
}

function mostrarPainel(autenticado) {
  document.getElementById("login").classList.toggle("hidden", autenticado);
  document.getElementById("dashboard").classList.toggle("hidden", !autenticado);
}

async function cadastrar() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    mensagem("Preencha seu e-mail e sua senha.");
    return;
  }

  mensagem("Criando sua conta...");

  const { data, error } = await client.auth.signUp({
    email,
    password
  });

  if (error) {
    mensagem("Erro: " + error.message);
    return;
  }

  if (!data.session) {
    mensagem("Conta criada! Confirme seu e-mail e depois entre.");
  } else {
    mostrarPainel(true);
    mensagem("Conta criada e acesso liberado!");
  }
}

async function entrar() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  mensagem("Verificando acesso...");

  const { data, error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    mensagem("Erro: " + error.message);
    return;
  }

  mostrarPainel(true);
  mensagem("Bem-vindo ao JARVIS!");
}

async function cadastrarPasskey() {
  mensagem("Preparando cadastro da Passkey...");

  const { data, error } = await client.auth.registerPasskey();

  if (error) {
    mensagem("Não foi possível cadastrar: " + error.message);
    return;
  }

  mensagem("Passkey cadastrada com sucesso! 🔐");
}

async function entrarPasskey() {
  mensagem("Aguardando autenticação do aparelho...");

  const { data, error } =
    await client.auth.signInWithPasskey();

  if (error) {
    mensagem("Falha na autenticação: " + error.message);
    return;
  }

  mostrarPainel(true);
  mensagem("Autenticação concluída! Bem-vindo ao JARVIS.");
}

async function sair() {
  await client.auth.signOut();
  mostrarPainel(false);
  mensagem("Sessão encerrada.");
}

async function verificarSessao() {
  const { data } = await client.auth.getSession();
  mostrarPainel(!!data.session);
}

verificarSessao();

client.auth.onAuthStateChange((_event, session) => {
  mostrarPainel(!!session);
});
</script>
</body>
</html>
